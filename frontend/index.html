<!DOCTYPE html>
<html>
<head>
  <title>Canvas Bulk Downloader</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; 
      max-width: 600px; margin: 40px auto; padding: 20px; 
    }
    h1 { 
      font-size: 28px; font-weight: 600; margin-bottom: 8px; 
      color: #1a1a1a;
    }
    .subtitle { 
      color: #666; font-size: 16px; margin-bottom: 32px; 
    }
    .course { 
      display: flex; align-items: center; 
      padding: 16px; border: 2px solid #e5e5e5; 
      border-radius: 12px; margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .course:hover { border-color: #007cba; }
    .course input[type="checkbox"] { 
      width: 20px; height: 20px; margin-right: 12px; 
      accent-color: #007cba;
    }
    .course label { 
      flex: 1; font-size: 16px; cursor: pointer; 
    }
    .toggle-section { 
      margin-top: 24px; padding-top: 20px; 
      border-top: 1px solid #eee;
    }
    .toggle-label { 
      display: block; color: #666; margin-bottom: 12px; 
      font-size: 14px;
    }
    .toggle-checkbox { 
      width: 18px; height: 18px; accent-color: #666;
    }
    button { 
      background: linear-gradient(135deg, #007cba, #005a87); 
      color: white; border: none; padding: 14px 28px; 
      border-radius: 8px; font-size: 16px; font-weight: 500;
      cursor: pointer; margin-top: 20px; width: 100%;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
  </style>
</head>
<body>
 <!-- Same styling as before -->
<h1>Canvas Bulk Downloader</h1>
<div class="subtitle">current year (2026 2nd semester)</div>

<button onclick="loadCurrentCourses()">Load Current Courses</button>
<div id="courses"><!-- Loads HBV403G etc. --></div>

<div class="toggle-section">
  <a href="overview.html">want to see previous years?</a>
</div>
<button onclick="downloadSelected()" disabled>Download Selected</button>

<script>
async function loadCurrentCourses() {
  const res = await fetch('http://localhost:3000/api/current-courses');
  const courses = await res.json();
  // renderCourses(courses, 'courses');  // Your render function
}
</script>

</body>
</html>
